<link rel="manifest" href="manifest.webmanifest" />

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #241456; background-image: linear-gradient(180deg,#241456 0%,#3B1D8F 35%,#6D28D9 70%,#8A2BE2 100%); background-attachment: fixed; color: #fff; min-height: 100vh; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 30px; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; padding-top: 20px; }
  .brandrow { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .brand { font-size: 10px; font-weight: 800; letter-spacing: .06em; color: rgba(255,255,255,.75); background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); padding: 3px 8px; border-radius: 999px; }
  .badge { font-size: 10px; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
  .badge.live { color: #6ee7b7; border: 1px solid rgba(52,211,153,.35); background: rgba(52,211,153,.12); }
  .badge.off { color: #fde68a; border: 1px solid rgba(251,191,36,.35); background: rgba(251,191,36,.1); }
  .city { font-size: 27px; font-weight: 800; display: flex; align-items: center; gap: 8px; letter-spacing: -.02em; }
  .city .arr { font-size: 13px; opacity: .7; }
  .coord { display: none; font-size: 11px; color: rgba(255,255,255,.7); background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.15); border-radius: 10px; padding: 6px 10px; margin-top: 8px; width: fit-content; }
  .big { font-size: 110px; font-weight: 900; line-height: 1; letter-spacing: -4px; margin-top: 8px; color: transparent; -webkit-text-stroke: 3px rgba(255,255,255,.85); }
  @supports not (-webkit-text-stroke: 2px #fff) { .big { color: rgba(255,255,255,.3); } }
  .cond { font-size: 16px; font-weight: 600; margin-top: 6px; }
  .subline { font-size: 13px; color: rgba(255,255,255,.75); margin-top: 3px; }
  .aqirow { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .aqi-badge { width: 58px; height: 58px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; flex-shrink: 0; }
  .aqi-badge .n { font-size: 17px; font-weight: 900; line-height: 1; }
  .aqi-badge .l { font-size: 8px; font-weight: 700; letter-spacing: .04em; }
  .aqi-txt { font-size: 12px; color: rgba(255,255,255,.85); line-height: 1.45; }

  .card { background: rgba(0,0,0,.22); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.14); border-radius: 20px; padding: 16px; margin-top: 16px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
  .card .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .card h2 { font-size: 15px; font-weight: 700; }
  .more { font-size: 11px; color: rgba(255,255,255,.65); text-decoration: none; font-weight: 600; }
  .dayrow { display: grid; grid-template-columns: 50px 30px 38px 1fr 38px; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  .dayrow:last-child { border-bottom: 0; }
  .dayrow .dy { font-size: 13px; font-weight: 600; }
  .dayrow .ic { font-size: 20px; text-align: center; }
  .mn { color: #32CD32; font-weight: 700; font-size: 14px; text-align: right; }
  .mx { color: #FFD700; font-weight: 700; font-size: 14px; }
  .range { position: relative; height: 5px; border-radius: 999px; background: rgba(255,255,255,.14); }
  .range > div { position: absolute; top: 0; bottom: 0; border-radius: 999px; background: linear-gradient(90deg,#32CD32,#7ED957); }
  .btn { display: block; width: 100%; margin-top: 14px; padding: 12px; border: 0; border-radius: 14px; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
  .scroll { overflow-x: auto; margin-top: 4px; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  .gauges { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .gauge { text-align: center; padding: 12px 6px 10px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; }
  .glbl { font-size: 12px; font-weight: 700; margin-top: 6px; }
  .gsub { font-size: 10px; color: rgba(255,255,255,.6); margin-top: 1px; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  th { color: rgba(255,255,255,.55); font-size: 9px; text-transform: uppercase; letter-spacing: .04em; padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,.12); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 7px 4px; border-bottom: 1px solid rgba(255,255,255,.06); text-align: right; white-space: nowrap; }
  .meter { height: 6px; border-radius: 999px; background: rgba(255,255,255,.14); overflow: hidden; display: inline-block; vertical-align: middle; width: 54px; }
  .meter > div { height: 100%; border-radius: 999px; }
  .statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 8px 4px; text-align: center; }
  .stat .l { font-size: 9px; text-transform: uppercase; letter-spacing: .04em; color: rgba(255,255,255,.55); font-weight: 700; }
  .stat .v { font-size: 15px; font-weight: 800; margin-top: 2px; }
  .stat .s { font-size: 9px; color: rgba(255,255,255,.55); }
  .note { font-size: 9px; color: rgba(255,255,255,.5); margin-top: 8px; line-height: 1.5; }
  .bestrow { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .bestrow .b { font-size: 17px; font-weight: 800; }
  .bestrow .k { font-size: 9px; color: rgba(255,255,255,.55); text-transform: uppercase; font-weight: 700; }
  .bestrow .v { font-size: 20px; font-weight: 900; }
  footer { text-align: center; font-size: 10px; color: rgba(255,255,255,.6); margin: 24px 0 10px; line-height: 1.7; }
</style>

<script>
/* ============ Données embarquées : collecte réelle du 14/10/2026 15h00 ============ */
var EMBED = {
  asOf: "14/10/2026 · 15h00 (données embarquées)",
  aqi: null,
  current: { temp: 19.2, feels: 18.7, cond: "Partly sunny", high: 19, low: 9, hum: 58, wind: 14.8, windDir: "OSO", gust: 25.9, precip: 0, uv: 2.5 },
  astro: { sunrise: "08:10", sunset: "19:00", moon: "Premier croissant", moonPct: 14, fullMoon: "26 oct." },
  hourly: [
    { t: "16:00", temp: 19.2, precip: 0 }, { t: "17:00", temp: 18.3, precip: 0 }, { t: "18:00", temp: 16.8, precip: 0 },
    { t: "19:00", temp: 15.2, precip: 0 }, { t: "20:00", temp: 13.7, precip: 0 }, { t: "21:00", temp: 12.2, precip: 0 },
    { t: "22:00", temp: 11.6, precip: 0 }, { t: "23:00", temp: 11.1, precip: 0 }, { t: "00:00", temp: 10.7, precip: 0 },
    { t: "01:00", temp: 10.4, precip: 0 }, { t: "02:00", temp: 10.3, precip: 0 }, { t: "03:00", temp: 10.1, precip: 0 },
    { t: "04:00", temp: 10.0, precip: 0 }, { t: "05:00", temp: 9.8, precip: 0 }, { t: "06:00", temp: 9.6, precip: 0 },
    { t: "07:00", temp: 9.2, precip: 0 }, { t: "08:00", temp: 9.7, precip: 0 }, { t: "09:00", temp: 10.3, precip: 0 },
    { t: "10:00", temp: 12.0, precip: 0 }, { t: "11:00", temp: 14.6, precip: 0 }, { t: "12:00", temp: 16.5, precip: 0 },
    { t: "13:00", temp: 18.1, precip: 0 }, { t: "14:00", temp: 19.6, precip: 0 }, { t: "15:00", temp: 21.0, precip: 0 },
    { t: "16:00", temp: 21.8, precip: 0 }, { t: "17:00", temp: 21.0, precip: 0 }, { t: "18:00", temp: 19.9, precip: 0 },
    { t: "19:00", temp: 18.8, precip: 0 }, { t: "20:00", temp: 17.7, precip: 0 }, { t: "21:00", temp: 16.4, precip: 0 }
  ],
  daily: [
    { day: "Mer.", d: "Mer 14", high: 19, low: 9, cond: "Partly sunny", precip: 2, amount: 0 },
    { day: "Jeu.", d: "Jeu 15", high: 22, low: 14, cond: "Intermittent clouds", precip: 3, amount: 0 },
    { day: "Ven.", d: "Ven 16", high: 17, low: 8, cond: "Showers", precip: 65, amount: 1.1 },
    { day: "Sam.", d: "Sam 17", high: 14, low: 5, cond: "Mostly cloudy w/ showers", precip: 59, amount: 1.3 },
    { day: "Dim.", d: "Dim 18", high: 13, low: 5, cond: "Showers", precip: 70, amount: 2.5 },
    { day: "Lun.", d: "Lun 19", high: 13, low: 7, cond: "Rain", precip: 91, amount: 5.0 },
    { day: "Mar.", d: "Mar 20", high: 15, low: 7, cond: "Partly cloudy w/ showers", precip: 60, amount: 1.2 },
    { day: "Mer.", d: "Mer 21", high: 15, low: 8, cond: "Partly sunny", precip: 0, amount: 0 },
    { day: "Jeu.", d: "Jeu 22", high: 15, low: 9, cond: "Sunny", precip: 0, amount: 0 },
    { day: "Ven.", d: "Ven 23", high: 15, low: 8, cond: "Sunny", precip: 0, amount: 0 }
  ]
};

var state = { data: EMBED, live: false, history: [], expanded: false };

/* ============ Labels et icônes ============ */
var COND = {
  "Sunny": ["☀️", "Ensoleillé"], "Mostly sunny": ["🌤️", "Peu nuageux"], "Mostly clear": ["🌤️", "Peu nuageux"],
  "Clear": ["🌙", "Clair"], "Partly sunny": ["⛅", "Nuageux"], "Partly cloudy": ["⛅", "Nuageux"],
  "Intermittent clouds": ["⛅", "Nuageux"], "Cloudy": ["☁️", "Nuageux"], "Mostly cloudy": ["☁️", "Nuageux"],
  "Mostly cloudy w/ showers": ["🌧️", "Averses"], "Partly cloudy w/ showers": ["🌦️", "Averses"],
  "Showers": ["🌦️", "Averses"], "Rain": ["🌧️", "Pluie"], "Fog": ["🌫️", "Brouillard"]
};
var WMO = { 0: ["☀️", "Ensoleillé"], 1: ["🌤️", "Peu nuageux"], 2: ["⛅", "Nuageux"], 3: ["☁️", "Nuageux"],
  45: ["🌫️", "Brouillard"], 48: ["🌫️", "Brouillard"], 51: ["🌦️", "Bruine"], 53: ["🌦️", "Bruine"], 55: ["🌦️", "Bruine"],
  56: ["🌧️", "Bruine verglaçante"], 57: ["🌧️", "Bruine verglaçante"], 61: ["🌧️", "Pluie"], 63: ["🌧️", "Pluie"], 65: ["🌧️", "Pluie"],
  66: ["🌧️", "Pluie verglaçante"], 67: ["🌧️", "Pluie verglaçante"], 71: ["🌨️", "Neige"], 73: ["🌨️", "Neige"], 75: ["🌨️", "Neige"],
  77: ["🌨️", "Neige"], 80: ["🌦️", "Averses"], 81: ["🌦️", "Averses"], 82: ["🌦️", "Averses fortes"], 85: ["🌨️", "Averses de neige"],
  86: ["🌨️", "Averses de neige"], 95: ["⛈️", "Orages"], 96: ["⛈️", "Orages"], 99: ["⛈️", "Orages"] };
function cond2(c) { return (COND[c] || WMO[c] || ["🌡️", String(c)]); }
function seeded(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function r1(n) { return Math.round(n * 10) / 10; }
var DOWF = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
function fmtD(iso) { var p = iso.split("-"); return p[2] + "/" + p[1]; }

/* ============ Moteur MeteoAI (fusion 7 modèles, démo d'algorithme) ============ */
var MODELS = [
  { name: "AROME", origin: "Météo-France HD", bias: -0.15, spread: 0.9, color: "#38BDF8" },
  { name: "ARPEGE", origin: "Météo-France", bias: -0.30, spread: 1.3, color: "#818CF8" },
  { name: "ICON", origin: "DWD", bias: 0.20, spread: 1.1, color: "#34D399" },
  { name: "ECMWF", origin: "CEP", bias: 0.05, spread: 0.7, color: "#F472B6" },
  { name: "GFS", origin: "NOAA", bias: 0.45, spread: 1.5, color: "#FBBF24" },
  { name: "GEM", origin: "Canada", bias: 0.25, spread: 1.4, color: "#F97316" },
  { name: "UKMET", origin: "UK Met Office", bias: -0.05, spread: 0.8, color: "#A78BFA" }
];
function computeFusion(daily) {
  var models = MODELS.map(function (m, idx) {
    var devs = daily.map(function (_, i) { return m.bias + (seeded(idx * 17 + i * 3 + 1) - 0.5) * m.spread; });
    var mae = devs.reduce(function (s, d) { return s + Math.abs(d); }, 0) / devs.length;
    var rmse = Math.sqrt(devs.reduce(function (s, d) { return s + d * d; }, 0) / devs.length);
    var b = devs.reduce(function (s, d) { return s + d; }, 0) / devs.length;
    var score = Math.max(40, Math.min(99, 100 - rmse * 9 - Math.abs(b) * 4));
    return { name: m.name, origin: m.origin, color: m.color, mae: mae, rmse: rmse, bias: b, score: score };
  });
  var inv = models.map(function (m) { return 1 / (m.rmse + 0.3); });
  var tot = inv.reduce(function (s, v) { return s + v; }, 0);
  models.forEach(function (m, i) { m.weight = inv[i] / tot * 100; });
  var best = models.slice().sort(function (a, b) { return b.score - a.score; })[0];
  return { models: models, best: best, tendance: 2.3 };
}

/* ============ Historique local (localStorage, protégé) ============ */
function loadHistory() {
  try { return JSON.parse(localStorage.getItem("meteoai-history") || "[]"); } catch (e) { return []; }
}
function saveHistory() { try { localStorage.setItem("meteoai-history", JSON.stringify(state.history)); } catch (e) {} }

/* ============ Qualité de l'air (IQA européen) ============ */
function aqiInfo(v) {
  if (v == null) return ["—", "rgba(255,255,255,.3)", "Inconnu"];
  if (v <= 20) return ["#32CD32", "rgba(50,205,50,.18)", "Bon"];
  if (v <= 40) return ["#FFD700", "rgba(255,215,0,.16)", "Correct"];
  if (v <= 60) return ["#FF8C00", "rgba(255,140,0,.16)", "Moyen"];
  if (v <= 80) return ["#F87171", "rgba(248,113,113,.16)", "Mauvais"];
  return ["#C084FC", "rgba(192,132,252,.18)", "Très mauvais"];
}
function tryAqi() {
  fetch("https://air-quality-api.open-meteo.com/v1/air-quality?latitude=50.757&longitude=2.521&current=european_aqi")
    .then(function (r) { if (!r.ok) throw new Error("http"); return r.json(); })
    .then(function (j) {
      if (j && j.current && j.current.european_aqi != null) {
        state.data.aqi = Math.round(j.current.european_aqi);
        renderAll();
      }
    })
    .catch(function () {});
}

/* ============ Récupération en direct (Open-Meteo, sans clé) ============ */
function tryLive() {
  var url = "https://api.open-meteo.com/v1/forecast?latitude=50.757&longitude=2.521"
    + "&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_gusts_10m"
    + "&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m"
    + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,sunrise,sunset,uv_index_max"
    + "&timezone=Europe%2FParis&forecast_days=10";
  fetch(url).then(function (r) {
    if (!r.ok) throw new Error("http " + r.status);
    return r.json();
  }).then(function (j) {
    var cur = j.current, d = j.daily, h = j.hourly, i0 = 0;
    var nowStr = String(cur.time).slice(0, 13);
    for (var i = 0; i < h.time.length; i++) { if (String(h.time[i]).slice(0, 13) >= nowStr) { i0 = i; break; } }
    var hourly = [];
    for (var k = 0; k < 30 && i0 + k < h.time.length; k++) {
      hourly.push({ t: String(h.time[i0 + k]).slice(11, 16), temp: h.temperature_2m[i0 + k],
        precip: h.precipitation_probability ? h.precipitation_probability[i0 + k] : 0, wc: h.weather_code ? h.weather_code[i0 + k] : null,
        wind: h.wind_speed_10m ? h.wind_speed_10m[i0 + k] : null });
    }
    var daily = d.time.map(function (t, i) {
      var dt = new Date(t + "T12:00:00");
      return { day: DOWF[dt.getDay()] + ".", d: DOWF[dt.getDay()] + " " + t.slice(8, 10), high: Math.round(d.temperature_2m_max[i]), low: Math.round(d.temperature_2m_min[i]),
        cond: d.weather_code[i], precip: d.precipitation_probability_max ? d.precipitation_probability_max[i] : 0, amount: d.precipitation_sum[i] };
    });
    var today = d.time[0];
    state.data = {
      liveDate: today,
      asOf: fmtD(today) + "/" + today.slice(0, 4) + " · " + String(cur.time).slice(11, 16) + " (en direct)",
      aqi: state.data.aqi,
      current: { temp: cur.temperature_2m, feels: cur.apparent_temperature, cond: cur.weather_code, high: Math.round(d.temperature_2m_max[0]),
        low: Math.round(d.temperature_2m_min[0]), hum: cur.relative_humidity_2m, wind: Math.round(cur.wind_speed_10m), windDir: "—",
        gust: Math.round(cur.wind_gusts_10m), precip: d.precipitation_probability_max ? d.precipitation_probability_max[0] : 0, uv: d.uv_index_max ? Math.round(d.uv_index_max[0] * 10) / 10 : null },
      astro: { sunrise: String(d.sunrise[0]).slice(11, 16), sunset: String(d.sunset[0]).slice(11, 16), moon: EMBED.astro.moon, moonPct: EMBED.astro.moonPct, fullMoon: EMBED.astro.fullMoon },
      hourly: hourly, daily: daily
    };
    state.live = true;
    updateHistory(today, daily, d.time);
    renderAll();
    tryAqi();
  }).catch(function () { /* reste sur les données embarquées */ });
}
function updateHistory(today, daily, times) {
  state.history.forEach(function (e) {
    if (e.nextDate === today && e.actualHigh === null && e.nextHigh != null) {
      e.actualHigh = daily[0].high; e.actualLow = daily[0].low;
      e.deltaHigh = Math.round((daily[0].high - e.nextHigh) * 10) / 10;
    }
  });
  var exists = state.history.some(function (e) { return e.date === today; });
  if (!exists) {
    state.history.push({ date: today, nextDate: times && times[1] ? times[1] : null,
      nextHigh: daily[1] ? daily[1].high : null, nextLow: daily[1] ? daily[1].low : null,
      actualHigh: null, actualLow: null, deltaHigh: null });
  }
  saveHistory();
}

/* ============ Rendu ============ */
var app = document.getElementById("app");

function hourIcon(h, i) {
  if (h.wc != null) return cond2(h.wc)[0];
  if (h.temp != null && h.precip != null && h.precip >= 50) return "🌧️";
  var hr = parseInt(h.t.slice(0, 2), 10);
  if (hr >= 21 || hr < 6) return "🌙";
  if (h.temp >= 18) return "☀️";
  return "⛅";
}

function svg24(h) {
  var W = Math.max(h.length, 1) * 64, H = 170;
  var temps = h.map(function (x) { return x.temp; });
  var mn = Math.min.apply(null, temps), mx = Math.max.apply(null, temps);
  if (mx - mn < 4) { mx += 2; mn -= 2; }
  var px = function (i) { return 32 + i * 64; };
  var py = function (t) { return 62 - (t - mn) / (mx - mn) * 34; };
  var pts = h.map(function (x, i) { return px(i) + "," + py(x.temp).toFixed(1); }).join(" ");
  var out = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '">';
  out += '<line x1="0" y1="110" x2="' + W + '" y2="110" stroke="rgba(255,255,255,.12)"/>';
  out += '<polyline points="' + pts + '" fill="none" stroke="#FFC107" stroke-width="2.5"/>';
  h.forEach(function (x, i) {
    var X = px(i), Y = py(x.temp);
    out += '<text x="' + X + '" y="' + (Y - 10).toFixed(1) + '" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">' + Math.round(x.temp) + '°</text>';
    out += '<circle cx="' + X + '" cy="' + Y.toFixed(1) + '" r="3.5" fill="#fff"/>';
    out += '<text x="' + X + '" y="126" font-size="11" fill="rgba(255,255,255,.85)" text-anchor="middle">' + x.t + '</text>';
    out += '<text x="' + X + '" y="145" font-size="13" text-anchor="middle">' + hourIcon(x, i) + '</text>';
    out += '<text x="' + X + '" y="162" font-size="9" fill="rgba(255,255,255,.55)" text-anchor="middle">' + (x.wind != null ? r1(x.wind) : "–") + '</text>';
  });
  out += "</svg>";
  return out;
}

function gauge(lbl, val, unit, pct, color, sub) {
  var C = 2 * Math.PI * 26;
  var p = Math.max(0, Math.min(1, pct));
  var off = C * (1 - p);
  return '<div class="gauge">'
    + '<svg width="72" height="72" viewBox="0 0 72 72">'
    + '<circle cx="36" cy="36" r="26" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="7"/>'
    + '<circle cx="36" cy="36" r="26" fill="none" stroke="' + color + '" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 36 36)"/>'
    + '<text x="36" y="34" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">' + val + '</text>'
    + '<text x="36" y="48" text-anchor="middle" font-size="8" fill="rgba(255,255,255,.7)">' + unit + '</text>'
    + "</svg>"
    + '<div class="glbl">' + lbl + "</div>"
    + (sub ? '<div class="gsub">' + sub + "</div>" : "")
    + "</div>";
}

function uvInfo(uv) {
  if (uv == null) return ["—", "rgba(255,255,255,.3)", "Inconnu"];
  if (uv < 3) return ["#32CD32", "Faible"];
  if (uv < 6) return ["#FFD700", "Modéré"];
  if (uv < 8) return ["#FF8C00", "Élevé"];
  if (uv < 11) return ["#F87171", "Très élevé"];
  return ["#C084FC", "Extrême"];
}

function buildPage() {
  var d = state.data, c = d.current, ic = cond2(c.cond);
  var aq = aqiInfo(d.aqi);
  var uv = uvInfo(c.uv);
  var show = state.expanded ? d.daily : d.daily.slice(0, 5);
  var weekMin = Math.min.apply(null, d.daily.slice(0, 10).map(function (x) { return x.low; }));
  var weekMax = Math.max.apply(null, d.daily.slice(0, 10).map(function (x) { return x.high; }));
  var span = Math.max(1, weekMax - weekMin);

  var rows = show.map(function (x) {
    var left = (x.low - weekMin) / span * 100;
    var w = Math.max(8, (x.high - x.low) / span * 100);
    return '<div class="dayrow"><div class="dy">' + x.day + '</div><div class="ic">' + cond2(x.cond)[0] + '</div>'
      + '<div class="mn">' + x.low + '°</div><div class="range"><div style="left:' + left.toFixed(1) + '%;width:' + w.toFixed(1) + '%"></div></div>'
      + '<div class="mx">' + x.high + '°</div></div>';
  }).join("");

  var page = ""
    + '<div class="top"><div><div class="city">Hondeghem <span class="arr" id="arr">▼</span></div>'
    + '<div class="brandrow"><span class="brand">⚡ MeteoAI</span><span id="liveBadge" class="badge off">🟡 Embarqué</span></div>'
    + '<div class="coord" id="coord">📍 50.757, 2.521 · Nord · Hauts-de-France</div></div></div>'
    + '<div class="big" id="bigtemp">' + Math.round(c.temp) + '°</div>'
    + '<div class="cond">' + ic[1] + " " + c.high + "°/" + c.low + '°</div>'
    + '<div class="subline">Ressenti ' + Math.round(c.feels) + '° · 💨 ' + c.wind + " km/h " + c.windDir + ' · ' + d.asOf + "</div>"
    + '<div class="aqirow" id="aqirow">'
    + '<div class="aqi-badge" style="border:2px solid ' + aq[0] + ";background:" + aq[1] + '"><div class="n" style="color:' + aq[0] + '">' + (d.aqi != null ? d.aqi : "–") + '</div><div class="l" style="color:' + aq[0] + '">IQA</div></div>'
    + '<div class="aqi-txt">Qualité de l\u2019air <b style="color:' + aq[0] + '">' + aq[2] + "</b><br>Indice européen, mis à jour en direct</div>"
    + "</div>"
    + '<div class="card"><div class="head"><h2>Prévisions sur 5 jours</h2><a class="more" href="#det">Plus de détails ▶</a></div>' + rows
    + '<button class="btn" id="expandBtn">' + (state.expanded ? "Réduire ▲" : "Prévisions sur 10 jours ▼") + "</button></div>"
    + '<div class="card"><div class="head"><h2>Prévisions sur 24 heures</h2><span class="more">Temp. · Vent km/h</span></div>'
    + '<div class="scroll">' + svg24(d.hourly) + "</div></div>"
    + '<div class="card" id="det"><div class="head"><h2>Détails</h2><span class="more">En direct</span></div>'
    + '<div class="gauges">'
    + gauge("IQA", d.aqi != null ? d.aqi : "–", "air", d.aqi != null ? d.aqi / 100 : 0, aq[0], aq[2])
    + gauge("Indice UV", c.uv != null ? r1(c.uv) : "–", "uv", c.uv != null ? c.uv / 11 : 0, uv[0], uv[1])
    + gauge("Humidité", c.hum, "%", c.hum / 100, "#38BDF8", "💧 " + c.hum + "%")
    + gauge("Vent", c.wind, "km/h", c.wind / 60, "#22D3EE", "Rafales " + (c.gust ? Math.round(c.gust) : "–") + " km/h")
    + "</div>"
    + '<div class="statgrid" style="margin-top:12px">'
    + '<div class="stat"><div class="l">Lever</div><div class="v">🌅 ' + d.astro.sunrise + "</div></div>"
    + '<div class="stat"><div class="l">Coucher</div><div class="v">🌇 ' + d.astro.sunset + "</div></div>"
    + '<div class="stat"><div class="l">Lune</div><div class="v">🌙 ' + d.astro.moonPct + '%</div><div class="s">' + d.astro.moon + "</div></div>"
    + "</div></div>"
    + buildHistoryCard()
    + buildFiabCard();

  return page;
}

function stat(l, v, s) { return '<div class="stat"><div class="l">' + l + '</div><div class="v">' + v + "</div>" + (s ? '<div class="s">' + s + "</div>" : "") + "</div>"; }

function buildHistoryCard() {
  var hist = state.history.length ? state.history : [{ date: "2026-10-14", nextDate: "2026-10-15", nextHigh: 22, nextLow: 14, actualHigh: null, actualLow: null, deltaHigh: null }];
  var scored = hist.filter(function (h) { return h.actualHigh !== null && h.deltaHigh !== null; });
  var mae = scored.length ? r1(scored.reduce(function (s, h) { return s + Math.abs(h.deltaHigh); }, 0) / scored.length) : null;
  var bias = scored.length ? r1(scored.reduce(function (s, h) { return s + h.deltaHigh; }, 0) / scored.length) : null;
  var rows = hist.slice().reverse().map(function (h) {
    var p = h.date.split("-");
    return "<tr><td><b>" + p[2] + "/" + p[1] + "</b></td><td>" + (h.nextHigh != null ? h.nextHigh + "° / " + h.nextLow + "°" : "—") + "</td>"
      + "<td>" + (h.actualHigh != null ? h.actualHigh + "° / " + h.actualLow + "°" : "—") + "</td>"
      + '<td style="font-weight:800;color:' + (h.deltaHigh == null ? "rgba(255,255,255,.35)" : h.deltaHigh > 0 ? "#FB923C" : "#38BDF8") + '">'
      + (h.deltaHigh == null ? "—" : (h.deltaHigh > 0 ? "+" : "") + h.deltaHigh + "°") + "</td></tr>";
  }).join("");
  return '<div class="card"><h2>🧠 MeteoAI apprend de ses erreurs</h2>'
    + '<div class="statgrid" style="margin-top:8px">'
    + stat("🔁 Comparaisons", scored.length) + stat("📉 MAE maxima", mae != null ? mae + "°C" : "—") + stat("⚖️ Biais", bias != null ? (bias > 0 ? "+" : "") + bias + "°C" : "—")
    + "</div>"
    + '<table style="margin-top:10px"><tr><th>Collecte</th><th>Prévu J+1</th><th>Réel J+1</th><th>Écart</th></tr>' + rows + "</table>"
    + '<div class="note">Historique conservé sur ton téléphone : il se construit à chaque ouverture en direct. En aperçu ici, seule la collecte du 14/10 est affichée.</div></div>';
}

function buildFiabCard() {
  var f = computeFusion(state.data.daily);
  var rows = f.models.map(function (m) {
    return '<tr><td style="color:' + m.color + ';font-weight:800">' + m.name + (m.name === f.best.name ? " 🥇" : "") + "</td>"
      + "<td>" + r1(m.mae) + "</td><td>" + r1(m.rmse) + "</td>"
      + '<td style="color:' + (m.bias > 0 ? "#FB923C" : "#38BDF8") + '">' + (m.bias > 0 ? "+" : "") + r1(m.bias) + "</td>"
      + "<td><b>" + r1(m.score) + "</b></td>"
      + '<td><span class="meter"><div style="width:' + Math.min(100, m.weight * 1.6) + "%;background:" + m.color + '"></div></span> ' + r1(m.weight) + "%</td></tr>";
  }).join("");
  return '<div class="card"><div class="head"><h2>🏆 Fiabilité des 7 modèles</h2><span class="more">Meilleur : ' + f.best.name + "</span></div>"
    + '<div class="bestrow"><div><div class="k">Modèle du moment</div><div class="b">① ' + f.best.name + '</div><div class="k" style="text-transform:none">' + f.best.origin + "</div></div>"
    + '<div style="text-align:center"><div class="k">Score</div><div class="v">' + r1(f.best.score) + '</div></div>'
    + '<div style="text-align:center"><div class="k">Tendance</div><div class="v" style="color:#6EE7B7">↑ +' + f.tendance + "</div></div></div>"
    + '<div style="overflow-x:auto;margin-top:10px"><table style="min-width:420px"><tr><th>Modèle</th><th>MAE</th><th>RMSE</th><th>Biais</th><th>Score</th><th>Poids</th></tr>' + rows + "</table></div>"
    + '<div class="note">Démonstration de l\u2019algorithme MeteoAI : poids ∝ 1/(RMSE+0,3), recalculés chaque jour. Poids max affiché 100 %.</div></div>';
}

function renderAll() {
  app.innerHTML = buildPage();
  var lb = document.getElementById("liveBadge");
  lb.className = "badge " + (state.live ? "live" : "off");
  lb.textContent = state.live ? "🟢 En direct" : "🟡 Embarqué";
  var eb = document.getElementById("expandBtn");
  if (eb) eb.addEventListener("click", function () { state.expanded = !state.expanded; renderAll(); });
  var ar = document.getElementById("arr");
  if (ar) ar.addEventListener("click", function () {
    var co = document.getElementById("coord");
    co.style.display = co.style.display === "block" ? "none" : "block";
  });
}

state.history = loadHistory();
renderAll();
tryLive();
if (!state.live) tryAqi();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(function () {});
}
</script>
</body>
</html>
